[package]
name = "csp-lang-wasm"
description = "The editor's script checker: csp-lang's checker and the game's script tables, built to WebAssembly for packages/lang-wasm (ADR 0030, T88.3)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for the WebAssembly module, rlib for the tests and the `script-data` binary.
crate-type = ["cdylib", "rlib"]

[dependencies]
csp-lang.workspace = true
csp-sim.workspace = true
csp-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pinned: `wasm-bindgen-cli` must be this same version (`scripts/wasm-build.mjs` says so).
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
