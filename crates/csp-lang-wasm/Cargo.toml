[package]
name = "csp-lang-wasm"
description = "The client's WebAssembly: csp-lang's script checker with the game's script tables (ADR 0030, T88.3), and the game's rules from csp-sim (ADR 0045, T122.1), for packages/lang-wasm."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test binary for all of `tests/` (see tests/all.rs).
autotests = false

[lib]
# cdylib for the WebAssembly module, rlib for the tests and the `script-data` binary.
crate-type = ["cdylib", "rlib"]

[dependencies]
csp-lang.workspace = true
csp-sim.workspace = true
csp-shared.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# Pinned: `wasm-bindgen-cli` must be this same version (`scripts/wasm-build.mjs` says so).
wasm-bindgen = "=0.2.130"

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true

[dev-dependencies]
csp-server = { path = "../csp-server" }
