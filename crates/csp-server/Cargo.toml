[package]
name = "csp-server"
description = "The I/O shell: HTTP, WebSocket sync, accounts, SQLite, saves, explored terrain, monitoring, the admin CLI and the benchmarks (ADR 0030)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "csp_server"
path = "src/lib.rs"

[[bin]]
name = "csp-server"
path = "src/main.rs"

[dependencies]
csp-shared.workspace = true
csp-sim.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
flate2.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"
indexmap.workspace = true
scrypt = { version = "0.11", default-features = false }
csp-lang.workspace = true
# The machine line of the benchmarks (`machineLine`): CPU model and memory.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# `bench-sim save` reads a copy of the database.
tempfile = "3"

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
