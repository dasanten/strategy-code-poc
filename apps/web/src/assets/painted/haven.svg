<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="384" height="384" viewBox="0 0 384 384" stroke-linejoin="round" stroke-linecap="round">
  <title>haven</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3cf9c"/>
      <stop offset="1" stop-color="#bf9c5f"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d3c8"/>
      <stop offset="1" stop-color="#928c82"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c58a4c"/>
      <stop offset="1" stop-color="#7f5028"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a466"/>
      <stop offset="1" stop-color="#9c6a36"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb7d4"/>
      <stop offset="1" stop-color="#3f7fa6"/>
    </linearGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd9a6"/>
      <stop offset="1" stop-color="#b8975a"/>
    </linearGradient>
    <linearGradient id="owner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfcfcb"/>
    </linearGradient>

    <g id="bollard">
      <circle r="11" fill="url(#wood)" stroke="#3d2a18" stroke-width="3.5"/>
      <circle r="4.5" fill="none" stroke="#5e3a1b" stroke-width="2"/>
    </g>
    <g id="barrel">
      <circle r="17" fill="url(#wood)" stroke="#3d2a18" stroke-width="4"/>
      <circle r="11" fill="none" stroke="#5e3a1b" stroke-width="2.5"/>
      <circle r="3" fill="#5e3a1b"/>
    </g>
    <g id="crate">
      <rect x="-20" y="-20" width="40" height="40" rx="3" fill="url(#wood)" stroke="#3d2a18" stroke-width="4"/>
      <path d="M-13 -13L13 13M13 -13L-13 13" stroke="#5e3a1b" stroke-width="3.5"/>
    </g>
  </defs>

  <!-- The yard on the shore, edge to edge. -->
  <rect x="14" y="14" width="356" height="356" rx="10" fill="url(#ground)" stroke="#3d2a18" stroke-width="4"/>

  <!-- The basin the slipway runs down into, with its stone quay. -->
  <path d="M206 14H360Q370 14 370 24V208H206Z" fill="url(#water)" stroke="#3d2a18" stroke-width="4"/>
  <g fill="none" stroke="#d3ecf7" stroke-width="3.5" opacity="0.8">
    <path d="M300 54q10-7 20 0t20 0"/>
    <path d="M318 112q10-7 20 0t20 0"/>
    <path d="M292 170q10-7 20 0t20 0"/>
  </g>
  <path d="M206 14V208H370" fill="none" stroke="#3d2a18" stroke-width="22"/>
  <path d="M206 14V208H370" fill="none" stroke="url(#stone)" stroke-width="15"/>
  <path d="M206 14V208H370" fill="none" stroke="#6f6a60" stroke-width="15" stroke-dasharray="3 22" stroke-linecap="butt"/>

  <!-- The slipway: planks sloping into the basin, with a boat's hull on it. -->
  <rect x="222" y="40" width="74" height="152" fill="url(#deck)" stroke="#3d2a18" stroke-width="4"/>
  <path d="M222 64H296M222 88H296M222 112H296M222 136H296M222 160H296" stroke="#7a4f26" stroke-width="2.5"/>
  <path d="M259 52Q284 92 280 142Q270 178 259 182Q248 178 238 142Q234 92 259 52Z" fill="url(#wood)" stroke="#3d2a18" stroke-width="4.5"/>
  <path d="M259 62V176M243 104H275M241 132H277M245 158H273" stroke="#5e3a1b" stroke-width="3"/>

  <!-- The jetty out into the water, on piles. -->
  <rect x="304" y="216" width="50" height="134" fill="url(#deck)" stroke="#3d2a18" stroke-width="4"/>
  <path d="M304 240H354M304 264H354M304 288H354M304 312H354" stroke="#7a4f26" stroke-width="2.5"/>
  <use xlink:href="#bollard" href="#bollard" x="318" y="336"/>
  <use xlink:href="#bollard" href="#bollard" x="340" y="336"/>

  <!-- The haven's storage: a timber shed with crates and barrels. -->
  <rect x="34" y="34" width="150" height="100" rx="4" fill="url(#wood)" stroke="#3d2a18" stroke-width="4.5"/>
  <path d="M34 84H184" stroke="#3d2a18" stroke-width="4"/>
  <path d="M60 34V134M86 34V134M112 34V134M138 34V134M164 34V134" stroke="#5e3a1b" stroke-width="2.5"/>
  <use xlink:href="#crate" href="#crate" x="62" y="170"/>
  <use xlink:href="#crate" href="#crate" x="106" y="170"/>
  <use xlink:href="#crate" href="#crate" x="84" y="214"/>
  <use xlink:href="#barrel" href="#barrel" x="156" y="166"/>
  <use xlink:href="#barrel" href="#barrel" x="164" y="206"/>

  <!-- A coil of rope and a stack of timber for the next boat. -->
  <circle cx="246" cy="262" r="26" fill="url(#rope)" stroke="#3d2a18" stroke-width="4"/>
  <circle cx="246" cy="262" r="16" fill="none" stroke="#a37f3e" stroke-width="3"/>
  <circle cx="246" cy="262" r="7" fill="url(#ground)" stroke="#3d2a18" stroke-width="3"/>
  <g>
    <rect x="44" y="270" width="180" height="16" rx="7" fill="url(#wood)" stroke="#3d2a18" stroke-width="4"/>
    <rect x="44" y="290" width="180" height="16" rx="7" fill="url(#wood)" stroke="#3d2a18" stroke-width="4"/>
    <rect x="44" y="310" width="180" height="16" rx="7" fill="url(#wood)" stroke="#3d2a18" stroke-width="4"/>
    <path d="M60 270V326M208 270V326" stroke="#5e3a1b" stroke-width="3"/>
  </g>

  <!-- The owner's flag on the shed's corner: light grey, like the sheet's flags. -->
  <path d="M34 24L104 34L88 48L106 66L34 56Z" fill="url(#owner)" stroke="#3d2a18" stroke-width="4"/>
  <use xlink:href="#bollard" href="#bollard" x="30" y="30"/>
</svg>
