name: CI

# CI minutes are scarce (ADR 0009, 0010): CI runs for PRs into dev (epics and bugs), for release
# PRs dev -> main, and for pushes to main (which deploy). Ticket PRs go into an epic branch and are
# checked locally; docs-only changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['docs/**', '**/*.md']

# A newer push to a PR supersedes the run in progress; runs on main always finish (they deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # Pinned, not ubuntu-latest: on ubuntu-26.04 the same tests ran about twice as slow, so the
    # timing budgets and 30 s test timeouts failed (main, 2026-11-01). Move up only after a run on
    # the new image shows the suite about as fast as on this one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails fast on a known advisory in a production dependency; a few seconds (ADR 0009).
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The Rust backend (ADR 0030): `pnpm check:rust`'s steps, on the same triggers as `check` (PRs
  # into dev and main, pushes to main), so ticket PRs into epic branches stay local (ADR 0009).
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  # Builds the production image for release PRs into main, so a broken Dockerfile shows up before
  # main. On main it is pushed to GHCR and deployed (ADR 0007). PRs into dev skip it.
  image:
    needs: [check, rust]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/dasanten/strategy-code-poc:${{ steps.meta.outputs.tag }}
            ghcr.io/dasanten/strategy-code-poc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'strategy-code-poc' }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy compose files
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" "mkdir -p $DEPLOY_DIR"
          scp -i ~/.ssh/id_deploy deploy/compose.yml deploy/Caddyfile "$TARGET:$DEPLOY_DIR/"
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_DIR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export IMAGE_TAG="${{ needs.image.outputs.tag }}"
          docker compose pull
          docker compose up -d
          docker logout ghcr.io
          docker image prune -f
          EOF
