name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Builds the production image on every push, so a broken Dockerfile shows up before main.
  # On main it is pushed to GHCR and deployed (ADR 0007).
  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/dasanten/strategy-code-poc:${{ steps.meta.outputs.tag }}
            ghcr.io/dasanten/strategy-code-poc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'strategy-code-poc' }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy compose files
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" "mkdir -p $DEPLOY_DIR"
          scp -i ~/.ssh/id_deploy deploy/compose.yml deploy/Caddyfile "$TARGET:$DEPLOY_DIR/"
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_DIR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export IMAGE_TAG="${{ needs.image.outputs.tag }}"
          docker compose pull
          docker compose up -d
          docker logout ghcr.io
          docker image prune -f
          EOF
