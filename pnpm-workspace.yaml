packages:
  - apps/*
  - packages/*

# Fail `pnpm install` on a Node older than `engines.node` instead of breaking later.
engineStrict: true

onlyBuiltDependencies:
  - esbuild

overrides:
  # The minimatch eslint pulls in has a globparts denial-of-service advisory (GHSA-g3hv-75wg-m249).
  'minimatch@<11.0.1': ^11.0.1
