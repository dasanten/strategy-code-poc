packages:
  - apps/*
  - packages/*

# Fail `pnpm install` on a Node older than `engines.node` instead of breaking later.
engineStrict: true

# better-sqlite3 ships prebuilt binaries for Windows, Linux and macOS, so it needs no build step.
onlyBuiltDependencies:
  - esbuild

# drizzle-kit's config loader (@esbuild-kit) pins an esbuild with a dev-server advisory
# (GHSA-67mh-4wv8-2f99); it only uses the transform API, which is unchanged in 0.25.
overrides:
  'esbuild@<0.25.0': ^0.25.0
